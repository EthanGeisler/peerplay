services:
  relay:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PORT: 3001
      RELAY_NAME: "My BoilerDeck Relay"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
